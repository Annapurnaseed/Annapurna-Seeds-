<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annapurna Seeds - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Fallback clean background + Agro poster */
            background: linear-gradient(rgba(10, 35, 20, 0.5), rgba(10, 35, 20, 0.7)), url('bg-agro.png') center/cover no-repeat fixed;
            background-color: #1b4332;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
        }

        .screen-wrapper {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Branding Head */
        .brand-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-logo-text {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .brand-tagline {
            font-size: 13px;
            color: #a3e635;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        /* 3D Glass Card */
        .auth-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            width: 100%;
            border-radius: 30px;
            padding: 26px 20px 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .card-header {
            margin-bottom: 18px;
        }
        .card-header h2 {
            font-size: 21px;
            font-weight: 900;
            color: #123e24;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-header p {
            font-size: 12px;
            color: #4a775d;
            margin-top: 3px;
        }

        /* 3D Inner-Shadow Capsule Inputs */
        .pill-field {
            display: flex;
            align-items: center;
            background: #f0f6f2;
            border-radius: 28px;
            padding: 6px 16px 6px 6px;
            margin-bottom: 14px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.08);
            border: 1px solid #dcece0;
        }
        .pill-field:focus-within {
            background: #ffffff;
            border-color: #27ae60;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.2), inset 0 1px 2px rgba(0,0,0,0.04);
        }

        /* 3D Icons */
        .field-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ffffff;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .icon-phone { background: linear-gradient(135deg, #27ae60, #1e824c); }
        .icon-lock { background: linear-gradient(135deg, #f43f5e, #be123c); }

        .field-body {
            display: flex;
            flex-direction: column;
            margin-left: 10px;
            flex: 1;
        }
        .field-body label {
            font-size: 10px;
            font-weight: 700;
            color: #174d2e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-row {
            display: flex;
            align-items: center;
        }
        .prefix {
            font-size: 14px;
            font-weight: 700;
            color: #143e24;
            margin-right: 6px;
        }
        .field-body input {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #143e24;
            outline: none;
            width: 100%;
        }
        .field-body input::placeholder {
            color: #94b8a1;
            font-weight: 400;
        }

        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin: 12px 6px 18px;
            color: #2d6a4f;
            font-weight: 600;
        }
        .option-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 3D Green Pill Button */
        .btn-green-pill {
            width: 100%;
            background: linear-gradient(180deg, #2ecc71 0%, #1e824c 100%) !important;
            border: none !important;
            border-radius: 35px !important;
            padding: 8px 10px 8px 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            color: #ffffff !important;
            font-size: 16px !important;
            font-weight: 800 !important;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 130, 76, 0.4), inset 0 2px 1px rgba(255,255,255,0.5) !important;
            outline: none;
        }
        .btn-green-pill:active {
            transform: scale(0.98);
        }
        .btn-arrow-circle {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e824c;
            font-size: 16px;
            font-weight: 900;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .switch-footer {
            text-align: center;
            font-size: 13px;
            margin-top: 18px;
            color: #557c64;
        }
        .switch-footer a {
            color: #1b683b;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="screen-wrapper">

    <div class="brand-box">
        <div class="brand-logo-text">🌾 Annapurna Seeds</div>
        <div class="brand-tagline">Quality Seeds • Better Harvest</div>
    </div>

    <div class="auth-card">
        <div class="card-header">
            <h2>Welcome Back 🍃</h2>
            <p>Login to continue your journey with Annapurna Seeds</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Mobile Field -->
            <div class="pill-field">
                <div class="field-icon icon-phone">📞</div>
                <div class="field-body">
                    <label>Mobile Number</label>
                    <div class="input-row">
                        <span class="prefix">+91</span>
                        <input type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10" required pattern="[0-9]{10}">
                    </div>
                </div>
            </div>

            <!-- Password Field -->
            <div class="pill-field">
                <div class="field-icon icon-lock">🔒</div>
                <div class="field-body">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required minlength="6">
                </div>
            </div>

            <div class="option-row">
                <label><input type="checkbox" checked> Remember Me</label>
                <span>Forgot Password?</span>
            </div>

            <!-- 3D Pill Button -->
            <button type="submit" id="submitBtn" class="btn-green-pill">
                <span>🌱</span>
                <span>Login</span>
                <div class="btn-arrow-circle">➔</div>
            </button>
        </form>

        <div class="switch-footer">
            Don't have an account? <a href="register.html">Register Now &gt;</a>
        </div>
    </div>

</div>

<script>
const supabaseUrl = 'https://aoisaiyugxuycuketisr.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvaXNhaXl1Z3h1eWN1a2V0aXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MDc0NTYsImV4cCI6MjEwNTE4MzQ1Nn0.PnTNtBrsjzLhKt-yIGpwIHYulTlEKFXx4uYVxnbbkkk';
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const mobile = document.getElementById('mobile').value.trim();
    const pass = document.getElementById('password').value;

    btn.disabled = true;
    btn.querySelector('span:nth-child(2)').innerText = "Verifying...";

    try {
        const { data, error } = await client
            .from('users')
            .select('*')
            .eq('mobile', mobile)
            .eq('password', pass)
            .maybeSingle();

        if (error) throw error;

        if (!data) {
            alert('Mobile number ya password galat hai!');
            btn.disabled = false;
            btn.querySelector('span:nth-child(2)').innerText = "Login";
            return;
        }

        localStorage.setItem('annapurna_user', JSON.stringify(data));
        window.location.href = 'index.html';

    } catch (err) {
        alert('Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.querySelector('span:nth-child(2)').innerText = "Login";
    }
}
</script>

</body>
</html>
